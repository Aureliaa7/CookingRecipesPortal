<div class="login-container">
  <mat-card class="form-container">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <mat-form-field class="form-field" appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" required>
          <mat-error *ngIf="loginForm.get('email')?.invalid &&
            (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">
            <span *ngIf="loginForm.get('email')?.errors?.required">
              The email is required!
            </span>
            <span *ngIf="loginForm.get('email')?.errors?.email">
              Invalid email!
            </span>
          </mat-error>
        </mat-form-field>

        <mat-form-field class="form-field" appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
          <mat-error *ngIf="loginForm.get('password')?.invalid &&
              (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
            <span>The password is required!</span>
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="submit-button">Log in</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
