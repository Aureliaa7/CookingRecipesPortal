<header>
  <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3">
    <div class="container">
      <a class="navbar-brand" [routerLink]="['/']">Cooking Recipes Portal</a>
      <button class="navbar-toggler"
              type="button"
              data-toggle="collapse"
              data-target=".navbar-collapse"
              aria-label="Toggle navigation"
              [attr.aria-expanded]="isExpanded"
              (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse collapse d-sm-inline-flex justify-content-end"
           [ngClass]="{ show: isExpanded }">
        <ul *ngIf="isUserAuthenticated()" class="navbar-nav flex-grow">
          <li class="nav-item">
            <div class="dropdown">
              <button class="nav-link text-dark">Recipes</button>
              <div class="dropdown-content">
                <a [routerLink]="['/user-recipes']">My Recipes</a>
                <a [routerLink]="['']">Saved Recipes</a>
                <a [routerLink]="['']">Favorite Recipes</a>
              </div>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <button class="nav-link text-dark">Users</button>
              <div class="dropdown-content">
                <a [routerLink]="['']">View</a>
                <a [routerLink]="['']">Followees</a>
              </div>
            </div>
          </li>

          <li class="nav-item">
            <button class="nav-link text-dark" (click)="logOut()">Log out</button>
          </li>
        </ul>
       
        <ul *ngIf="!isUserAuthenticated()" class="navbar-nav flex-grow">
          <li class="nav-item" [routerLinkActive]="['link-active']">
            <a class="nav-link text-dark" [routerLink]="['/register']">Register</a>
          </li>
          <li class="nav-item" [routerLinkActive]="['link-active']">
            <a class="nav-link text-dark" [routerLink]="['/login']">Log in</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
