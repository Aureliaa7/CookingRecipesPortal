<div class="carousel-container">
  <mat-carousel [hideArrows]="shouldHideArrows"
                [hideIndicators]="false"
                [maintainAspectRatio]="false"
                [slideHeight]="'250px'">
    <mat-carousel-slide *ngFor="let image of base64Images"
                        [image]="image"
                        [hideOverlay]="false">
    </mat-carousel-slide>
  </mat-carousel>
</div>
